    <radialGradient id="g1" cx="65%" cy="55%" r="55%"><stop offset="0" stop-color="#ec4899" stop-opacity=".95"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#fbcfe8" stop-opacity=".9"/><stop offset="1" stop-color="#fbcfe8" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
